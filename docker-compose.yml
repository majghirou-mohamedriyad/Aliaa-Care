version: '3.8'

services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    ports:
      - "2785:2785"
    environment:
      - PORT=2785
      - API_KEY=038e00c4bf9448b2a0fe948ea9b2b141
      - ENGINE_TYPE=baileys
      - AUTO_START_SESSIONS=true
      - SIMULATE_TYPING=true
    volumes:
      - openwa_data:/app/data
    restart: unless-stopped

  db-umami:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=umami_secure_pass_123
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    ports:
      - "3003:3000"
    environment:
      - DATABASE_URL=postgresql://umami:umami_secure_pass_123@db-umami:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=c0febece363c5d979cf050f5
    depends_on:
      - db-umami
    restart: unless-stopped

volumes:
  openwa_data:
  umami_db_data:
