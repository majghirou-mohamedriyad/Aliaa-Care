version: '3.8'

services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    ports:
      - "2785:2785"
    environment:
      - PORT=2785
      - API_KEY=038e00c4bf9448b2a0fe948ea9b2b141
      - ENGINE_TYPE=baileys
      - AUTO_START_SESSIONS=true
      - SIMULATE_TYPING=true
    volumes:
      - openwa_data:/app/data
    restart: unless-stopped

volumes:
  openwa_data:
